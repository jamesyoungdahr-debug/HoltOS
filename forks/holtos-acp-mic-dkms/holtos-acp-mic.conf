# HoltOS (holtos-acp-mic-dkms): on the ASUS ROG Flow Z13 (GZ302) the AMD
# audio coprocessor is driven by snd_pci_ps, whose digital microphone path
# works on ACP 7.0. The firmware's config flag would otherwise let the legacy
# snd_acp_pci driver claim the chip first; its microphone path records only
# garbage on this machine. This package is installed only on the GZ302.
# Remove the package (pacman -R holtos-acp-mic-dkms) and reboot to undo.
blacklist snd_acp_pci
