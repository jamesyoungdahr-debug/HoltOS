# HoltOS: snd-pci-ps with the ASUS ROG Flow Z13 (GZ302) digital microphone
# quirk, and snd-ps-pdm-dma with microphone clock test settings. Built from
# Linux 7.2.4's sound/soc/amd/ps sources, so it builds only for 7.2 kernels;
# on any other kernel the stock modules are used.
PACKAGE_NAME="holtos-acp-mic"
PACKAGE_VERSION="@PKGVER@"
BUILT_MODULE_NAME[0]="snd-pci-ps"
DEST_MODULE_LOCATION[0]="/updates/dkms"
BUILT_MODULE_NAME[1]="snd-ps-pdm-dma"
DEST_MODULE_LOCATION[1]="/updates/dkms"
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"
BUILD_EXCLUSIVE_KERNEL="^7\.2\."
AUTOINSTALL="yes"
