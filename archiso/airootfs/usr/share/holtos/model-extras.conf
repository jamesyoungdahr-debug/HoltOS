# Hardware-specific extras holtos-system-extras installs on matching
# machines only. KEY=yes turns one on; anything else leaves it off.
#
# ASUS ROG Flow Z13 (2025, GZ302): z13ctl and z13gui (RGB, profiles, fan
# curves, TDP, battery limit), from the HoltOS package repository.
ASUS_Z13_2025=yes
# ASUS ROG Flow Z13 (2025, GZ302): built-in microphones, which its firmware
# hides from Linux (holtos-acp-mic-dkms, a DKMS quirk for the AMD audio
# module; needs a restart after it installs).
ASUS_Z13_2025_MIC=yes
