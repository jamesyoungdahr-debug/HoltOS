# Hardware-specific extras holtos-system-extras installs on matching
# machines only. KEY=yes turns one on; anything else leaves it off.
#
# ASUS ROG Flow Z13 (2025, GZ302): z13ctl and z13gui (RGB, profiles, fan
# curves, TDP, battery limit), from the HoltOS package repository.
ASUS_Z13_2025=yes
# ASUS ROG Flow Z13 (2025, GZ302): built-in microphones. Turned off on
# 2026-09-15: holtos-acp-mic-dkms set the microphones up, but they send no
# signal on Linux under either AMD driver or any clock setting tested, and
# the package was withdrawn from the HoltOS package repository.
ASUS_Z13_2025_MIC=no
