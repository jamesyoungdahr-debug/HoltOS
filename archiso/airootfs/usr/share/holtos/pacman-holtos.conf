
# HoltOS package repository — HoltOS-built packages (the glass forks,
# Calamares, Limine tools, ZFS, model extras), published as a pacman repo on
# the HoltOS GitHub release tagged "packages" (tools/publish-packages.sh).
# Appended to /etc/pacman.conf at image build (customize_airootfs.sh) and by
# the config update on installs that predate it. Called [homelab] until the
# rename to HoltOS (2026-09-14); the config update renames that section.
# Unsigned over HTTPS from our own release: the alpha's trust model.
[holtos]
SigLevel = Optional TrustAll
Server = https://github.com/jamesyoungdahr-debug/holtos/releases/download/packages
