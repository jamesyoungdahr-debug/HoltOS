# Drivers HoltOS installs only on machines that have the hardware.
# Everything most machines need is in the image for everyone (Mesa with
# Vulkan and video decode for AMD and Intel graphics, linux-firmware, both
# CPU microcodes, PipeWire, Bluetooth). The installer installs matching
# packages from the copies staged on the ISO (holtos-detect-hardware.sh);
# every update installs any that are missing, and they update with the
# system (holtos-system-extras). Read by /usr/local/bin/holtos-hardware.
#
# One rule per line:  KIND  MATCH  PACKAGES  DESCRIPTION
#   KIND pci    MATCH VENDOR:DEVICES@CLASS  DEVICES is * or a comma list of
#               4-digit device IDs; CLASS is a prefix of the 4-digit PCI
#               class (03 = any display controller, 0280 = Wi-Fi)
#   KIND usb    MATCH comma list of VENDOR:PRODUCT, PRODUCT may be * or end
#               in * (04f3:0c*)
#   KIND cpu    MATCH the vendor_id from /proc/cpuinfo (GenuineIntel, AuthenticAMD)
#   KIND sysfs  MATCH a path glob that exists on this machine
#   KIND dmi    MATCH FIELD=GLOB, a /sys/class/dmi/id file (board_name,
#               product_name, sys_vendor) whose content matches the glob
#   PACKAGES    comma list, no spaces
#   DESCRIPTION the rest of the line, shown to the user
#
# Liam, 2026-09-14: "we should be checking the install target's hardware and
# provide working drivers, not just NVIDIA".

pci    10de:*@03      nvidia-open-dkms,nvidia-utils,lib32-nvidia-utils  NVIDIA graphics
pci    14e4:4311,4312,4313,4315,4328,4329,432a,432b,432c,432d,4331,4353,4357,4358,4359,4360,43a0,43b1@02  broadcom-wl-dkms  Broadcom Wi-Fi (wl driver)
pci    8086:*@0401    sof-firmware,alsa-ucm-conf  Intel laptop audio
pci    8086:*@0403    sof-firmware,alsa-ucm-conf  Intel laptop audio
pci    1022:*@0403    sof-firmware,alsa-ucm-conf  AMD laptop audio
pci    8086:*@03      libva-intel-driver  video decode on older Intel graphics
cpu    GenuineIntel   thermald  Intel CPU temperature management
sysfs  /sys/bus/iio/devices/iio:device*  iio-sensor-proxy  screen rotation and light sensors
sysfs  /sys/bus/thunderbolt/devices/domain*  bolt  Thunderbolt devices
usb    06cb:*,27c6:*,138a:*,04f3:0c*,1c7a:*,10a5:*  fprintd  fingerprint reader
# ROG Flow Z13 (GZ302EA, GZ302EAC) built-in microphones: holtos-acp-mic-dkms
# was withdrawn on 2026-09-15. It set the microphones up, but they send no
# signal on Linux under either AMD driver or any clock setting tested
# (forks/holtos-acp-mic-dkms/README-HOLTOS.md). No rule until AMD or the
# kernel supports them.
