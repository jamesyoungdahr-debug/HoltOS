
# HoltOS package repository — HoltOS-built packages (the glass forks,
# Calamares, Limine tools, ZFS), published as a pacman repo on the HoltOS
# GitHub release tagged "packages" (tools/publish-packages.sh). Appended to
# /etc/pacman.conf at image build (customize_airootfs.sh) and by the
# config update on installs that predate it. Unsigned over HTTPS from our
# own release: the alpha's trust model.
[homelab]
SigLevel = Optional TrustAll
Server = https://github.com/jamesyoungdahr-debug/holtos/releases/download/packages
