# Deliberately minimal: only overrides passwordRequirements. Every other
# key (defaultGroups, sudoersGroup, shell, hostname template, autologin,
# etc.) is left unset so Calamares' own built-in defaults apply — same as
# before this file existed, when there was no users.conf at all and
# those settings already worked correctly (wheel/sudo group, etc.).
# Confirmed against Calamares' own upstream users.conf (the canonical
# reference for every key and its real default) before writing this.
#
# The only requirement is a 4-character minimum — no complexity/class
# requirements, no dictionary/pattern checks.
#
# libpwquality's own minlen is a SEPARATE check from Calamares' minLength
# below, and libpwquality silently clamps any minlen under 6 up to 6 —
# confirmed against libpwquality's own docs/source; there is no way to
# get a real 4-character floor out of minlen itself. (Hit this live:
# minlen=4 here still produced "The password is shorter than 6
# characters" — libpwquality's message, not Calamares'.) minlen=0 is
# libpwquality's actual "disabled" value (same as the stock/upstream
# users.conf uses for its own "no restriction" default) — so libpwquality
# is fully disabled here, and Calamares' own minLength (no such floor)
# is the only thing actually enforcing 4.
---
passwordRequirements:
    minLength: 4
    libpwquality:
        - minlen=0
        - minclass=0
