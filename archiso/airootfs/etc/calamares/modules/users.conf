# Deliberately minimal: only overrides passwordRequirements. Every other
# key (defaultGroups, sudoersGroup, shell, hostname template, autologin,
# etc.) is left unset so Calamares' own built-in defaults apply — same as
# before this file existed, when there was no users.conf at all and
# those settings already worked correctly (wheel/sudo group, etc.).
# Confirmed against Calamares' own upstream users.conf (the canonical
# reference for every key and its real default) before writing this.
#
# The only requirement is a 4-character minimum — no complexity/class
# requirements, no dictionary/pattern checks.
#
# libpwquality's own minlen is a SEPARATE check from Calamares' minLength
# below. Tried minlen=4, then minlen=0 (libpwquality's documented
# "disabled" value) — both still produced "The password is shorter than
# 6 characters" (libpwquality's message, not Calamares') on a live test.
# Calamares' own docs are blunt about this: "disable libpwquality at
# build-time" is the only way listed to fully remove its influence — no
# config value actually gets you under its ~6-character floor. Rather
# than keep guessing at libpwquality knobs, bypassing it entirely via
# allowWeakPasswords (pre-checked, so nothing needs to change from a
# user's perspective) and relying purely on Calamares' own minLength —
# which does NOT have this floor — is the reliable path.
---
passwordRequirements:
    minLength: 4
    libpwquality:
        - minlen=0
        - minclass=0
allowWeakPasswords: true
allowWeakPasswordsDefault: true
