# Calamares finished module — HoltOS override.
#
# Calamares' stock default is `restartNowMode: user-unchecked`: the
# "Restart now" checkbox is shown but NOT ticked, so clicking Done just
# quits the installer back to the live desktop. Confirmed live 2026-09-11
# on the first test that actually watched this page — and with the dark
# stylesheet the unticked box was invisible, so it looked like the
# Done/quit() fix simply hadn't worked (see stylesheet.qss for the
# indicator fix). Every install of this image is expected to reboot into
# the new system, so tick it by default; the user can still untick it.
---
restartNowMode: user-checked
restartNowCommand: "systemctl -i reboot"
notifyOnFinished: false
