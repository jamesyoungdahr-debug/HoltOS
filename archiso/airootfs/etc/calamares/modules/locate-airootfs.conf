# Calamares shellprocess: make sure the live medium's squashfs is where
# unpackfs.conf expects it (/run/archiso/bootmnt/...), whatever way the
# ISO was booted — Ventoy, copytoram, an unmounted stick. Runs in the
# live session (dontChroot) right before unpackfs. See
# homelab-locate-airootfs.sh.
---
dontChroot: true
timeout: 120
script:
    - command: "bash /usr/local/bin/homelab-locate-airootfs.sh"
      timeout: 120
