# Calamares shellprocess: install hardware-specific drivers (NVIDIA) into
# the target based on what lspci sees — see homelab-detect-hardware.sh.
# Runs after cleanup-live (pacman keyring initialized, calamares removed)
# and before limine-bootloader (which appends the kernel-cmdline extras
# this step may write).
---
dontChroot: false
timeout: 900
script:
    - command: "bash /usr/local/bin/homelab-detect-hardware.sh"
      timeout: 900
