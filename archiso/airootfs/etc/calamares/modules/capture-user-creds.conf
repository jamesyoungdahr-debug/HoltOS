# Captures the plaintext username/password just entered on the Users page,
# for shellprocess@generate-secrets to pick up later (so Authentik's
# bootstrap admin password matches the OS account's password — see
# homelab-generate-secrets.sh). Must run before the `users` exec job in
# settings.conf: GlobalStorage only holds the plaintext until `users` hashes
# it.
#
# Originally written as a custom `interface: python` job module using
# libcalamares.globalstorage — reverted because this Calamares build has no
# pythonjob plugin compiled in (Calamares Initialization Failed:
# "capture-user-creds@capture-user-creds" could not be loaded). shellprocess
# can reach the same GlobalStorage values via ${gs[key]} substitution, no
# Python interpreter needed.
#
# Second revert: an intermediate version routed the values through an
# `environment:` block and referenced them in `command:` as plain shell
# variables ($HOLTOS_CAPTURED_USER). That doesn't work — shellprocess scans
# the *entire* command string for `$WORD` patterns and validates each one
# against its own known substitutions (ROOT/USER/LANG/gs[...]); it has no
# concept of "this is a shell variable I set myself via environment:", so it
# rejected the job outright every time ("commands use variables that are
# not defined... HOLTOS_CAPTURED_USER, HOLTOS_CAPTURED_PASS") and broke
# every install. ${gs[key]} substituted directly into the command is the
# only form that actually works here.
#
# Known limitation (inherent to Calamares' ${gs[...]} substitution, not
# specific to this config): the substituted value is spliced into the
# command as plain text with no shell-escaping. A password containing a
# literal single quote breaks the quoting (the install step fails with a
# shell syntax error rather than silently succeeding) — annoying but not a
# code-execution risk, since it's the *user's own* password on their *own*
# install.
---
dontChroot: false
timeout: 10
script:
    - command: >-
        install -m 600 /dev/null /etc/holtos-bootstrap-creds &&
        printf 'HOLTOS_BOOTSTRAP_USERNAME=%s\nHOLTOS_BOOTSTRAP_PASSWORD=%s\n'
        '${gs[username]}' '${gs[password]}' > /etc/holtos-bootstrap-creds
