# HoltOS Calamares configuration.
#
# Based on Calamares' own default settings.conf (see
# calamares/settings.conf upstream) — modules trimmed to what we actually
# use, and `bootloader` replaced with our own Limine shellprocess job (the
# stock `bootloader` module only supports grub/systemd-boot natively).
#
# No separate step is needed to place HoltOS' own files (The Den, the
# updater, themes, wallpapers) onto the target — they're just part of this
# live image's own airootfs, so `unpackfs` below copies them to the target
# along with everything else in the live rootfs. That's the whole point of
# the Arch/archiso live-install model: the live session *is* the system
# being installed, unlike Fedora/Anaconda which reinstalls packages from
# repos onto the target.

modules-search: [ local ]

# The generic `shellprocess` module under its own id + config file — same
# mechanism Calamares' own default settings.conf documents for e.g. a
# custom-configured packagechooserq instance.
instances:
- id:       limine-bootloader
  module:   shellprocess
  config:   limine-bootloader.conf
- id:       fix-mkinitcpio
  module:   shellprocess
  config:   fix-mkinitcpio.conf
- id:       cleanup-live
  module:   shellprocess
  config:   cleanup-live.conf
- id:       detect-hardware
  module:   shellprocess
  config:   detect-hardware.conf
- id:       locate-airootfs
  module:   shellprocess
  config:   locate-airootfs.conf
# "Keeping Windows?" notes before Partitions (dual boot).
- id:       dualboot
  module:   notesqml
  config:   notesqml-dualboot.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - notesqml@dualboot
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - shellprocess@locate-airootfs
  - unpackfs
  - machineid
  - locale
  - keyboard
  - localecfg
  - fstab
  - initcpiocfg
  - shellprocess@fix-mkinitcpio
  - initcpio
  - users
  - displaymanager
  - shellprocess@cleanup-live
  - shellprocess@detect-hardware
  - networkcfg
  - hwclock
  - services-systemd
  - shellprocess@limine-bootloader
  - umount
- show:
  - finished

# Custom branding (etc/calamares/branding/holtos/) — the pipeline is now
# proven end to end, so this replaces Calamares' own bundled "default"
# placeholder branding (which is where "Arch Linux Installer" and "Fancy
# GNU/Linux ... Venomous Vole" came from).
branding: holtos

prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: false
quit-at-end: false
