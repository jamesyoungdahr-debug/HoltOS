# Overrides Authentik's OWN built-in bootstrap blueprint
# (/blueprints/system/bootstrap.yaml in the image — fetched verbatim from
# goauthentik/authentik's actual source as the reference for this file)
# to create the admin account with the OS account's username directly,
# instead of the hardcoded "akadmin".
#
# Why this file, not a second blueprint that renames "akadmin" after the
# fact: tried that first (etc/authentik/blueprints/admin-username.yaml,
# now removed) and it didn't reliably work. The stock bootstrap.yaml runs
# with `state: present` (create-or-update) against `identifiers: {username:
# akadmin}`; a *separate* rename blueprint racing against that — mounted
# in /blueprints/custom, watched/applied independently and on its own
# timing — can run before Authentik's own bootstrap.yaml has created
# "akadmin" yet. When that happens, `present` semantics mean the rename
# blueprint's own `identifiers: {username: akadmin}` + `attrs: {username:
# <ours>}` *creates a new user* using the attrs username instead of
# finding anything to rename — a mostly-empty account with no password
# and no superuser group, while the stock bootstrap.yaml then goes on to
# separately create the *real*, fully-configured "akadmin" once it runs.
# End state: two accounts, and neither one is "the OS username + the OS
# password" the user actually expects to work.
#
# Replacing the file outright (mounted over the same path the stock one
# lives at, so only this version ever runs — see the Volume= line in
# authentik-server.container / authentik-worker.container) creates the
# admin account exactly once, correctly, with the desired username from
# the start. AUTHENTIK_ADMIN_USERNAME is set in
# /var/mnt/tank/appdata/secrets/authentik.env by
# homelab-generate-secrets.sh; falls back to "akadmin" if unset, matching
# stock behavior exactly when nothing was captured.
version: 1
metadata:
  name: authentik Bootstrap
  labels:
    blueprints.goauthentik.io/system-bootstrap: "true"
    blueprints.goauthentik.io/system: "true"
context:
  username: !Env [AUTHENTIK_ADMIN_USERNAME, "akadmin"]
  group_name: authentik Admins
  email: !Env [AUTHENTIK_BOOTSTRAP_EMAIL, "root@example.com"]
  password: !Env [AUTHENTIK_BOOTSTRAP_PASSWORD, null]
  password_hash: !Env [AUTHENTIK_BOOTSTRAP_PASSWORD_HASH, null]
  token: !Env [AUTHENTIK_BOOTSTRAP_TOKEN, null]
entries:
  - model: authentik_core.group
    state: created
    identifiers:
      name: !Context group_name
    attrs:
      is_superuser: true
    id: admin-group
  - model: authentik_core.user
    state: created
    id: admin-user
    identifiers:
      username: !Context username
    attrs:
      name: authentik Default Admin
      email: !Context email
      groups:
        - !KeyOf admin-group
      password: !Context password
      password_hash: !Context password_hash
  - model: authentik_core.token
    state: created
    conditions:
      - !If [!Context token]
    identifiers:
      identifier: authentik-bootstrap-token
      intent: api
      expiring: false
      user: !KeyOf admin-user
    attrs:
      key: !Context token
