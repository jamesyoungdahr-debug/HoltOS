# HoltOS smartd configuration (media-server-must-haves.md #3: SMART
# monitoring with a desktop notification when a disk degrades).
#
# DEVICESCAN: every disk smartd can see. -a: all health/attribute/error-log
# checks. -o on / -S on: enable automatic offline testing and attribute
# autosave. -n standby,q: do not spin up a sleeping disk just to poll it
# (a media box's drives idle most of the day). -m <nomailer> with
# -M exec: no mail, run our script instead -- it records the alert for the
# per-login notice. -M once: one alert per problem, not one per poll.
DEVICESCAN -a -o on -S on -n standby,q -m <nomailer> -M exec /usr/local/bin/holtos-disk-alert -M once
